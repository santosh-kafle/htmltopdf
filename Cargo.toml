[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal crates
presswork-dom = { path = "crates/dom" }
presswork-style = { path = "crates/style" }
presswork-layout = { path = "crates/layout" }
presswork-paint = { path = "crates/paint" }

# External crates
anyhow = "1"
# Local time for the [date] and [time] header variables.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive", "env"] }
regex = "1"
html5ever = "0.40"
cssparser = "0.38"
selectors = "0.43"
precomputed-hash = "0.1"
parley = "0.13"
# Load fontconfig at runtime instead of linking it: building needs no
# fontconfig headers, and the binary starts without fontconfig installed.
fontique = { version = "0.13", features = ["fontconfig-dlopen"] }
krilla = "0.8"
read-fonts = "0.46"
url = "2.5"
data-url = "0.3"
miniz_oxide = "0.9"
# Only the formats krilla can embed.
imagesize = { version = "0.14", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
