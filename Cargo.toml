[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal crates
presswork-dom = { path = "crates/dom" }
presswork-style = { path = "crates/style" }
presswork-layout = { path = "crates/layout" }
presswork-paint = { path = "crates/paint" }

# External crates
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
regex = "1"
html5ever = "0.40"
cssparser = "0.38"
selectors = "0.43"
precomputed-hash = "0.1"
parley = "0.13"
krilla = "0.8"
url = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
